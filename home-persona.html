<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>홈 페르소나 | 인테리어 취향 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Space+Grotesk:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAF7F2;
    --bg-2: #F1EAE0;
    --card: #FFFFFF;
    --ink: #2B2620;
    --ink-dim: #5C5347;
    --ink-faint: #9C9186;
    --accent: #C1694A;
    --accent-dim: #D98F72;
    --sage: #6B7F5E;
    --line: rgba(43,38,32,0.1);
    --radius: 18px;
  }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background: radial-gradient(ellipse at top, rgba(193,105,74,0.1), transparent 55%), var(--bg);
  }
  .stage {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 44px 20px 64px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 10px;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── INTRO ── */
  #intro { justify-content: center; align-items: center; gap: 22px; text-align: center; }
  #intro h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.45;
  }
  .sub { color: var(--ink-dim); font-size: 15px; line-height: 1.75; max-width: 340px; }
  .meta-row {
    display: flex; justify-content: center; gap: 18px;
    font-size: 12px; color: var(--ink-faint);
    font-family: 'Space Grotesk', sans-serif;
  }
  .meta-row span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-dim); }

  /* ── BUTTONS ── */
  .btn {
    font-family: 'Pretendard', sans-serif;
    font-weight: 600; font-size: 16px;
    padding: 16px 28px; border-radius: 999px;
    border: none; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #FFFFFF; }
  .btn-ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }

  /* ── QUIZ ── */
  #quiz { gap: 20px; }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.35s ease; }
  .progress-num { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--ink-faint); white-space: nowrap; }
  .category-tag { align-self: center; font-size: 12px; letter-spacing: 0.08em; color: var(--sage); font-family: 'Space Grotesk', sans-serif; }
  .question-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px; line-height: 1.65;
    text-align: center; padding: 8px 4px;
    min-height: 70px;
    display: flex; align-items: center; justify-content: center;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
  .choice {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 18px;
    text-align: left;
    color: var(--ink);
    font-size: 15px; line-height: 1.6;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    font-family: 'Pretendard', sans-serif;
    width: 100%;
    box-shadow: 0 1px 8px rgba(43,38,32,0.06);
    display: flex; align-items: center; gap: 14px;
  }
  .choice:hover { border-color: var(--accent); box-shadow: 0 2px 14px rgba(193,105,74,0.15); }
  .choice:active { transform: scale(0.985); }
  .choice-body { display: flex; flex-direction: column; min-width: 0; }
  .choice-letter { font-family: 'Space Grotesk', sans-serif; font-size: 11px; color: var(--accent); display: block; margin-bottom: 4px; letter-spacing: 0.1em; }

  /* option visual chip */
  .opt-visual { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; border: 1px solid var(--line); overflow: hidden; }

  .density-visual { display: flex; align-items: flex-end; justify-content: center; gap: 3px; background: var(--bg-2); }
  .density-bar { width: 6px; border-radius: 2px; background: var(--line); }
  .density-bar:nth-child(1) { height: 9px; }
  .density-bar:nth-child(2) { height: 16px; }
  .density-bar:nth-child(3) { height: 23px; }
  .density-bar:nth-child(4) { height: 30px; }
  .density-bar.filled { background: var(--accent); }

  .mat-wood      { background: repeating-linear-gradient(100deg, #C9A177 0 6px, #B8895F 6px 8px); }
  .mat-rattan    { background: repeating-linear-gradient(60deg, #D2A968 0 4px, #B98F4E 4px 7px); }
  .mat-fabric    { background: radial-gradient(circle at 4px 4px, rgba(43,38,32,0.12) 1px, transparent 1.5px) 0 0/8px 8px, #F1EAE0; }
  .mat-ceramic   { background: linear-gradient(160deg, #EDEAE3, #D3CDBF); }
  .mat-metal     { background: linear-gradient(135deg, #C7CBCE, #8B9094 45%, #EAEEF0 55%, #6E7377); }
  .mat-cement    { background: radial-gradient(circle at 25% 35%, rgba(0,0,0,0.12) 0 1px, transparent 1px) 0 0/9px 9px, linear-gradient(#BDB9B1,#A6A29A); }
  .mat-concrete  { background: radial-gradient(circle at 30% 30%, rgba(0,0,0,0.12) 0 1px, transparent 1px) 0 0/9px 9px, linear-gradient(#B9BEC0,#9CA1A3); }
  .mat-brass     { background: linear-gradient(135deg, #E3C27E, #B8892B 55%, #F0D48F); }
  .mat-steel     { background: linear-gradient(135deg, #E2E5E7, #AEB3B6); }
  .mat-blacksteel{ background: linear-gradient(135deg, #3D3D3D, #161616 60%, #4A4A4A); }

  .pat-solid    { background: #EDE6D9; }
  .pat-stripe   { background: repeating-linear-gradient(90deg, #8C9C88 0 3px, #EDE6D9 3px 9px); }
  .pat-bold     { background: repeating-linear-gradient(45deg, #C1694A 0 8px, #EDE6D9 8px 16px); }
  .pat-colorful { background: conic-gradient(#E4523A, #F2C230, #3C7CA6, #6B7F5E, #E4523A); }

  .art-bw           { background: linear-gradient(135deg, #3A3A3A, #D9D9D6); }
  .art-tone         { background: linear-gradient(135deg, #B7A98C, #E8E1D3); }
  .art-illustration { background: linear-gradient(135deg, #E8C55A, #7A9B76, #3C7CA6); }
  .art-pop          { background: conic-gradient(#E4523A, #F2C230, #3C7CA6, #E4523A); }

  .back-link {
    text-align: center; font-size: 13px; color: var(--ink-faint);
    background: none; border: none; cursor: pointer; padding: 8px;
    font-family: 'Pretendard', sans-serif;
  }

  /* ── RESULT ── */
  #result { gap: 16px; }
  .result-hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 30px 24px 26px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(43,38,32,0.07);
  }
  .type-code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px; letter-spacing: 0.15em;
    color: var(--ink-faint);
  }
  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 23px; color: var(--accent);
    line-height: 1.45;
    margin: 8px 0 6px;
  }
  .result-sub { font-size: 14px; color: var(--ink-faint); margin-bottom: 16px; }
  .result-desc { font-size: 14px; color: var(--ink-dim); line-height: 1.8; text-align: left; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px 22px;
    box-shadow: 0 2px 16px rgba(43,38,32,0.07);
  }
  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 20px;
  }

  /* spectrum bars */
  .spec-item { margin-bottom: 18px; }
  .spec-item:last-child { margin-bottom: 0; }
  .spec-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
  .spec-labels .active-pole { color: var(--ink); font-weight: 600; }
  .spec-track { position: relative; height: 6px; border-radius: 6px; background: var(--bg-2); }
  .spec-dot {
    position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card);
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(43,38,32,0.25);
    transition: left 0.8s cubic-bezier(.25,.8,.25,1);
  }

  /* palette */
  .palette-row { display: flex; gap: 8px; }
  .swatch { flex: 1; text-align: center; }
  .swatch-color { width: 100%; padding-top: 100%; border-radius: 12px; border: 1px solid var(--line); position: relative; }
  .swatch-name { font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; line-height: 1.4; }

  /* tags */
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-chip {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px; color: var(--sage);
    background: rgba(107,127,94,0.1);
    border-radius: 999px; padding: 6px 12px;
  }

  .taste-list { list-style: none; }
  .taste-list li {
    font-size: 13.5px; color: var(--ink-dim); line-height: 1.7;
    padding-left: 16px; position: relative; margin-bottom: 8px;
  }
  .taste-list li:last-child { margin-bottom: 0; }
  .taste-list li::before {
    content: ''; position: absolute; left: 0; top: 8px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-dim);
  }

  .style-ref { font-size: 13.5px; color: var(--ink-dim); line-height: 1.7; }
  .style-ref b { color: var(--accent); font-weight: 600; }

  .cta-row { display: flex; flex-direction: column; gap: 10px; }
  .source-note { font-size: 11.5px; color: var(--ink-faint); line-height: 1.65; padding: 0 8px; text-align: center; }
</style>
</head>
<body>
<div class="stage">

  <!-- INTRO -->
  <div class="screen active" id="intro">
    <div class="eyebrow">Home Persona Test</div>
    <h1>나도 몰랐던<br>진짜 인테리어 취향은?</h1>
    <div style="display:flex; justify-content:center; margin: 4px 0;">
      <svg width="160" height="140" viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="80" cy="126" rx="58" ry="8" fill="#C1694A" opacity="0.12"/>
        <path d="M28 62 L80 24 L132 62" stroke="#C1694A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="38" y="60" width="84" height="58" rx="4" fill="#F1EAE0" stroke="#D98F72" stroke-width="2.5"/>
        <rect x="58" y="80" width="22" height="22" rx="2" fill="#FFFFFF" stroke="#6B7F5E" stroke-width="2"/>
        <line x1="69" y1="80" x2="69" y2="102" stroke="#6B7F5E" stroke-width="1.5"/>
        <line x1="58" y1="91" x2="80" y2="91" stroke="#6B7F5E" stroke-width="1.5"/>
        <rect x="92" y="86" width="16" height="32" rx="2" fill="#C1694A" opacity="0.85"/>
        <circle cx="103" cy="102" r="1.6" fill="#FAF7F2"/>
        <circle cx="140" cy="40" r="10" fill="#D98F72" opacity="0.5"/>
        <circle cx="20" cy="48" r="6" fill="#6B7F5E" opacity="0.4"/>
      </svg>
    </div>
    <p class="sub">12개의 질문으로 간단하게 알아보는<br>나의 진짜 공간 취향</p>
    <div class="meta-row">
      <span><span class="dot"></span>12문항</span>
      <span><span class="dot"></span>약 2분</span>
      <span><span class="dot"></span>4개 축</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">테스트 시작하기</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="quiz">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">1 / 12</div>
    </div>
    <div class="category-tag" id="categoryTag"></div>
    <div class="question-text" id="questionText"></div>
    <div class="choices" id="choices"></div>
    <button class="back-link" id="backBtn" onclick="goBack()">← 이전 질문</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="result">
    <div class="result-hero">
      <div class="eyebrow">당신의 홈 페르소나</div>
      <div class="type-code" id="typeCode"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-desc" id="resultDesc"></div>
    </div>

    <div class="card">
      <div class="card-title">취향 스펙트럼</div>
      <div id="specBreakdown"></div>
    </div>

    <div class="card">
      <div class="card-title">컬러 팔레트</div>
      <div class="palette-row" id="paletteRow"></div>
    </div>

    <div class="card">
      <div class="card-title">분위기 키워드</div>
      <div class="tag-row" id="tagRow"></div>
    </div>

    <div class="card">
      <div class="card-title">이런 취향일 확률 높아요</div>
      <ul class="taste-list" id="tasteList"></ul>
    </div>

    <div class="card">
      <div class="card-title">잘 어울리는 스타일</div>
      <div class="style-ref" id="styleRef"></div>
    </div>

    <div class="cta-row">
      <button class="btn btn-primary" id="retakeBtn" onclick="location.reload()">다시 테스트하기</button>
      <button class="btn btn-ghost" id="shareBtn" onclick="shareResult()">결과 공유하기</button>
    </div>
    <p class="source-note">이 테스트는 톤·밀도·재질·무드 4가지 축으로 공간 취향을 재미있게 분석해보는 자체 제작 콘텐츠입니다.</p>
  </div>

</div>
<script>
const AXES = {
  tone:     { label: "톤",   neg: "라이트", pos: "다크",        negLetter: "L", posLetter: "D" },
  density:  { label: "밀도", neg: "미니멀", pos: "맥시멀",      negLetter: "M", posLetter: "X" },
  material: { label: "재질", neg: "내추럴", pos: "인더스트리얼", negLetter: "N", posLetter: "I" },
  mood:     { label: "무드", neg: "차분",   pos: "비비드",      negLetter: "C", posLetter: "V" }
};
const AXIS_ORDER = ["tone", "density", "material", "mood"];

function densityVisual(level) {
  return { type:"density", level: level };
}

const QUESTIONS = [
  { axis:"tone", q:"가장 끌리는 벽 컬러는?", options:[
    {text:"화이트·아이보리", score:-2, visual:{type:"color", colors:["#FFFFFF","#F5EFDD"]}},
    {text:"라이트 그레이·베이지", score:-1, visual:{type:"color", colors:["#D9D6CF","#E8DCC8"]}},
    {text:"그레이지·그레이브라운", score:1, visual:{type:"color", colors:["#A79C8E","#8C7F6E"]}},
    {text:"차콜·딥그린·네이비", score:2, visual:{type:"color", colors:["#2E2E2E","#1F3D2B","#1B2A44"]}}] },
  { axis:"density", q:"선반 위에는 보통?", options:[
    {text:"아무것도 없는 게 좋다", score:-2, visual:densityVisual(0)},
    {text:"화분 한두 개 정도", score:-1, visual:densityVisual(1)},
    {text:"좋아하는 소품 여러 개", score:1, visual:densityVisual(2)},
    {text:"책·소품·액자로 가득", score:2, visual:densityVisual(3)}] },
  { axis:"material", q:"가장 끌리는 가구 소재는?", options:[
    {text:"우드·원목", score:-2, visual:{type:"material", mat:"wood"}},
    {text:"패브릭·리넨", score:-1, visual:{type:"material", mat:"fabric"}},
    {text:"메탈·스틸", score:1, visual:{type:"material", mat:"metal"}},
    {text:"콘크리트·유리", score:2, visual:{type:"material", mat:"concrete"}}] },
  { axis:"mood", q:"쿠션 컬러를 고른다면?", options:[
    {text:"뉴트럴 베이지·그레이", score:-2, visual:{type:"color", colors:["#E3DCCF","#B7B2A8"]}},
    {text:"톤다운 그린·브라운", score:-1, visual:{type:"color", colors:["#6E7A5C","#7A5C3E"]}},
    {text:"컬러 포인트 하나", score:1, visual:{type:"color", colors:["#C1694A"]}},
    {text:"원색·패턴 믹스매치", score:2, visual:{type:"color", colors:["#E4523A","#F2C230","#3C7CA6"]}}] },

  { axis:"tone", q:"가장 편안하게 느끼는 거실 조명 분위기는?", options:[
    {text:"화사한 자연광 가득", score:-2, visual:{type:"color", colors:["#FFF6D9"]}},
    {text:"밝은 화이트 조명", score:-1, visual:{type:"color", colors:["#F5F3EC"]}},
    {text:"은은한 무드등", score:1, visual:{type:"color", colors:["#D9B36C"]}},
    {text:"어둡고 그림자 있는 포인트 조명", score:2, visual:{type:"color", colors:["#2A2420"]}}] },
  { axis:"density", q:"옷장을 연다면?", options:[
    {text:"옷 몇 벌만 걸린 미니멀 옷장", score:-2, visual:densityVisual(0)},
    {text:"계절별로 정리된 적당한 양", score:-1, visual:densityVisual(1)},
    {text:"다양한 스타일의 많은 옷", score:1, visual:densityVisual(2)},
    {text:"옷과 소품이 넘치는 옷장", score:2, visual:densityVisual(3)}] },
  { axis:"material", q:"화분을 고른다면 어떤 스타일?", options:[
    {text:"라탄·우드 화분", score:-2, visual:{type:"material", mat:"rattan"}},
    {text:"세라믹 화분", score:-1, visual:{type:"material", mat:"ceramic"}},
    {text:"시멘트 화분", score:1, visual:{type:"material", mat:"cement"}},
    {text:"메탈 화분", score:2, visual:{type:"material", mat:"metal"}}] },
  { axis:"mood", q:"좋아하는 패턴은?", options:[
    {text:"무지(민무늬)", score:-2, visual:{type:"pattern", style:"solid"}},
    {text:"잔잔한 스트라이프", score:-1, visual:{type:"pattern", style:"stripe"}},
    {text:"큼직한 패턴", score:1, visual:{type:"pattern", style:"bold"}},
    {text:"화려한 컬러 패턴", score:2, visual:{type:"pattern", style:"colorful"}}] },

  { axis:"tone", q:"옷장에 가장 많은 옷 컬러는?", options:[
    {text:"화이트·베이지", score:-2, visual:{type:"color", colors:["#FFFFFF","#E8DCC2"]}},
    {text:"그레이·라이트카키", score:-1, visual:{type:"color", colors:["#B8B2A6","#A6A184"]}},
    {text:"카키·브라운", score:1, visual:{type:"color", colors:["#7C7355","#6B4E34"]}},
    {text:"블랙·네이비", score:2, visual:{type:"color", colors:["#1C1C1C","#1B2A44"]}}] },
  { axis:"density", q:"여행 기념품에 대한 나는?", options:[
    {text:"사진만 찍고 사지 않는다", score:-2, visual:densityVisual(0)},
    {text:"작은 것 하나 정도만", score:-1, visual:densityVisual(1)},

    keywords:["#맥시멀","#펑크무드","#그래피티","#멀티컬러","#자유로움"],
    taste:["그래피티풍 아트웍이 가득한 벽","형광·원색 가구와 소품의 자유로운 믹스","네온사인이나 강렬한 조명","빈티지와 모던을 섞은 소품들"],
    styleRef:"<b>맥시멀펑크st</b> 인테리어와 잘 맞아요." }
};

let scores = { tone:0, density:0, material:0, mood:0 };
let current = 0;
let history = [];
let shuffledOptions = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderVisual(v) {
  if (!v) return '';
  if (v.type === 'color') {
    const colors = v.colors;
    if (colors.length === 1) {
      return '<div class="opt-visual" style="background:' + colors[0] + '"></div>';
    }
    const stops = colors.map(function(c, i) {
      const start = (i / colors.length * 100).toFixed(1);
      const end = ((i + 1) / colors.length * 100).toFixed(1);
      return c + ' ' + start + '%, ' + c + ' ' + end + '%';
    }).join(', ');
    return '<div class="opt-visual" style="background:linear-gradient(135deg,' + stops + ')"></div>';
  }
  if (v.type === 'material') {
    return '<div class="opt-visual mat-' + v.mat + '"></div>';
  }
  if (v.type === 'density') {
    let bars = '';
    for (let i = 0; i < 4; i++) {
      bars += '<span class="density-bar' + (i <= v.level ? ' filled' : '') + '"></span>';
    }
    return '<div class="opt-visual density-visual">' + bars + '</div>';
  }
  if (v.type === 'pattern') {
    return '<div class="opt-visual pat-' + v.style + '"></div>';
  }
  if (v.type === 'art') {
    return '<div class="opt-visual art-' + v.style + '"></div>';
  }
  return '';
}

window.addEventListener('DOMContentLoaded', function() {
  const hash = window.location.hash;
  if (hash && hash.startsWith('#result=')) {
    const parts = hash.replace('#result=', '').split(',').map(Number);
    if (parts.length === 4 && parts.every(p => !isNaN(p) && p >= 0 && p <= 100)) {
      document.getElementById('intro').classList.remove('active');
      document.getElementById('result').classList.add('active');
      const pctByAxis = { tone: parts[0], density: parts[1], material: parts[2], mood: parts[3] };
      renderResult(pctByAxis);
      document.getElementById('shareBtn').style.display = 'none';
      const retakeBtn = document.getElementById('retakeBtn');
      retakeBtn.textContent = '나도 테스트하기';
      retakeBtn.onclick = function() { window.location.href = window.location.pathname; };
    }
  }
});

function startQuiz() {
  scores = { tone:0, density:0, material:0, mood:0 };
  current = 0;
  history = [];
  shuffledOptions = QUESTIONS.map(function(q) { return shuffle(q.options); });
  document.getElementById('intro').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const axis = AXES[q.axis];
  document.getElementById('categoryTag').textContent = axis.label + ' · ' + axis.neg + ' ↔ ' + axis.pos;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('progressFill').style.width = (current / QUESTIONS.length * 100) + '%';
  document.getElementById('progressNum').textContent = (current + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  shuffledOptions[current].forEach(function(opt, i) {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.onclick = function() { answer(opt); };
    btn.innerHTML = renderVisual(opt.visual) +
      '<div class="choice-body"><span class="choice-letter">' + String.fromCharCode(65 + i) + '</span><span>' + opt.text + '</span></div>';
    choicesEl.appendChild(btn);
  });
}

function answer(opt) {
  const q = QUESTIONS[current];
  scores[q.axis] += opt.score;
  history.push({ axis: q.axis, score: opt.score });
  current++;
  if (current >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function goBack() {
  if (current === 0) return;
  current--;
  const h = history.pop();
  scores[h.axis] -= h.score;
  renderQuestion();
}

function axisMax(axisKey) {
  return QUESTIONS.filter(q => q.axis === axisKey).length * 2;
}

function computePctByAxis() {
  const result = {};
  AXIS_ORDER.forEach(function(axisKey) {
    const max = axisMax(axisKey);
    const min = -max;
    result[axisKey] = Math.round(((scores[axisKey] - min) / (max - min)) * 100);
  });
  return result;
}

function typeCodeFromPct(pctByAxis) {
  return AXIS_ORDER.map(function(axisKey) {
    const axis = AXES[axisKey];
    return pctByAxis[axisKey] >= 50 ? axis.posLetter : axis.negLetter;
  }).join('');
}

function showResult() {
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('result').classList.add('active');
  const pctByAxis = computePctByAxis();
  try {
    window.history.replaceState(null, null, '#result=' + AXIS_ORDER.map(a => pctByAxis[a]).join(','));
  } catch (e) {}
  renderResult(pctByAxis);
}

function renderResult(pctByAxis) {
  const code = typeCodeFromPct(pctByAxis);
  const type = TYPES[code];

  document.getElementById('typeCode').textContent = code;
  document.getElementById('resultTitle').textContent = type.title;
  document.getElementById('resultSub').textContent = type.sub;
  document.getElementById('resultDesc').textContent = type.desc;

  const specEl = document.getElementById('specBreakdown');
  specEl.innerHTML = '';
  AXIS_ORDER.forEach(function(axisKey) {
    const axis = AXES[axisKey];
    const pct = pctByAxis[axisKey];
    const item = document.createElement('div');
    item.className = 'spec-item';
    item.innerHTML =
      '<div class="spec-labels">' +
        '<span class="' + (pct < 50 ? 'active-pole' : '') + '">' + axis.neg + '</span>' +
        '<span class="' + (pct >= 50 ? 'active-pole' : '') + '">' + axis.pos + '</span>' +
      '</div>' +
      '<div class="spec-track"><div class="spec-dot" style="left:0%" data-target="' + pct + '"></div></div>';
    specEl.appendChild(item);
  });
  setTimeout(function() {
    document.querySelectorAll('.spec-dot').forEach(function(dot) {
      dot.style.left = dot.dataset.target + '%';
    });
  }, 120);

  const paletteEl = document.getElementById('paletteRow');
  paletteEl.innerHTML = '';
  type.palette.forEach(function(c) {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.innerHTML = '<div class="swatch-color" style="background:' + c[0] + '"></div><div class="swatch-name">' + c[1] + '</div>';
    paletteEl.appendChild(sw);
  });

  const tagEl = document.getElementById('tagRow');
  tagEl.innerHTML = '';
  type.keywords.forEach(function(k) {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.textContent = k;
    tagEl.appendChild(chip);
  });

  const tasteEl = document.getElementById('tasteList');
  tasteEl.innerHTML = '';
  type.taste.forEach(function(t) {
    const li = document.createElement('li');
    li.textContent = t;
    tasteEl.appendChild(li);
  });

  document.getElementById('styleRef').innerHTML = type.styleRef;
}

function shareResult() {
  const title = document.getElementById('resultTitle').textContent;
  const sub = document.getElementById('resultSub').textContent;
  const url = window.location.origin + window.location.pathname + window.location.hash;
  const text = '나의 홈 페르소나는?\n"' + title + '" — ' + sub + '\n\n나도 테스트해보기 👉 ' + url;
  if (navigator.share) {
    navigator.share({ title: '홈 페르소나 테스트', text: text, url: url });
  } else {
    navigator.clipboard.writeText(text).then(function() {
      alert('결과가 클립보드에 복사됐어요! 원하는 곳에 붙여넣기 하세요.');
    }).catch(function() {
      prompt('아래 텍스트를 복사해서 공유하세요:', text);
    });
  }
}
</script>
