<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>부자 마인드 자가진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Space+Grotesk:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAF8F2;
    --bg-2: #F2EEE4;
    --card: #FFFFFF;
    --ink: #1C2B20;
    --ink-dim: #4D5E50;
    --ink-faint: #8E9E90;
    --gold: #B8892B;
    --gold-dim: #C9A44A;
    --teal: #1E8A6A;
    --line: rgba(28,43,32,0.1);
    --radius: 18px;
  }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background: radial-gradient(ellipse at top, rgba(184,137,43,0.1), transparent 55%), var(--bg);
  }
  .stage {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 44px 20px 64px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin-bottom: 10px;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── INTRO ── */
  #intro { justify-content: center; align-items: center; gap: 22px; text-align: center; }
  #intro h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.45;
  }
  .intro-icon-row { display: flex; justify-content: center; gap: 12px; margin: 2px 0; }
  .intro-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700;
    color: var(--gold);
  }
  .sub { color: var(--ink-dim); font-size: 15px; line-height: 1.75; max-width: 340px; }
  .meta-row {
    display: flex; justify-content: center; gap: 18px;
    font-size: 12px; color: var(--ink-faint);
    font-family: 'Space Grotesk', sans-serif;
  }
  .meta-row span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-dim); }

  /* ── BUTTONS ── */
  .btn {
    font-family: 'Pretendard', sans-serif;
    font-weight: 600; font-size: 16px;
    padding: 16px 28px; border-radius: 999px;
    border: none; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--gold); color: #FFFFFF; }
  .btn-ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }

  /* ── QUIZ ── */
  #quiz { gap: 20px; }
  .progress-row { display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.35s ease; }
  .progress-num { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--ink-faint); white-space: nowrap; }
  .category-tag { align-self: center; font-size: 12px; letter-spacing: 0.08em; color: var(--teal); font-family: 'Space Grotesk', sans-serif; }
  .question-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px; line-height: 1.65;
    text-align: center; padding: 8px 4px;
    min-height: 88px;
    display: flex; align-items: center; justify-content: center;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
  .choice {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-align: left;
    color: var(--ink);
    font-size: 15px; line-height: 1.6;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    font-family: 'Pretendard', sans-serif;
    width: 100%;
    box-shadow: 0 1px 8px rgba(28,43,32,0.06);
  }
  .choice:hover { border-color: var(--gold); box-shadow: 0 2px 14px rgba(184,137,43,0.15); }
  .choice:active { transform: scale(0.985); }
  .choice:focus { outline: none; border-color: var(--line); }
  .choice-letter { font-family: 'Space Grotesk', sans-serif; font-size: 11px; color: var(--gold); display: block; margin-bottom: 6px; letter-spacing: 0.1em; }
  .back-link {
    text-align: center; font-size: 13px; color: var(--ink-faint);
    background: none; border: none; cursor: pointer; padding: 8px;
    font-family: 'Pretendard', sans-serif;
  }

  /* ── RESULT ── */
  #result { gap: 16px; }
  .result-hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(28,43,32,0.07);
  }
  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 23px; color: var(--gold);
    line-height: 1.45;
    margin: 8px 0 6px;
  }
  .result-sub { font-size: 14px; color: var(--ink-faint); margin-bottom: 22px; }
  .pct-ring {
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto;
  }
  .pct-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 700; color: var(--gold);
  }
  .pct-label { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }

  .cat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px 22px;
    box-shadow: 0 2px 16px rgba(28,43,32,0.07);
  }
  .cat-section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; letter-spacing: 0.1em;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 22px;
  }
  .cat-item { margin-bottom: 22px; }
  .cat-item:last-child { margin-bottom: 0; }
  .cat-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cat-item-name { font-size: 14px; font-weight: 600; color: var(--ink); }
  .cat-item-pct { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--teal); }
  .cat-bar-track { height: 5px; background: var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 9px; }
  .cat-bar-fill { height: 100%; background: var(--teal); border-radius: 5px; width: 0%; transition: width 0.9s cubic-bezier(.25,.8,.25,1); }
  .cat-item-desc { font-size: 13.5px; color: var(--ink-dim); line-height: 1.75; }

  .cta-row { display: flex; flex-direction: column; gap: 10px; }
  .source-note { font-size: 11.5px; color: var(--ink-faint); line-height: 1.65; padding: 0 8px; text-align: center; }
</style>
</head>
<body>
<div class="stage">

  <!-- INTRO -->
  <div class="screen active" id="intro">
    <div class="eyebrow">Money Mindset Check</div>
    <h1>열심히 사는데<br>돈이 안 모인다면</h1>
    <div style="display:flex; justify-content:center; margin: 4px 0;">
      <svg width="200" height="168" viewBox="0 0 200 168" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="102" cy="148" rx="60" ry="12" fill="#8B6A2A" opacity="0.2"/>
        <circle cx="100" cy="88" r="66" fill="#9C7220"/>
        <circle cx="100" cy="88" r="62" fill="#B8892B"/>
        <circle cx="100" cy="88" r="55" fill="#D6AE4F"/>
        <circle cx="100" cy="88" r="48" fill="none" stroke="#C9A030" stroke-width="1.5" opacity="0.6"/>
        <ellipse cx="80" cy="68" rx="30" ry="18" fill="#EDD070" opacity="0.4" transform="rotate(-25 80 68)"/>
        <ellipse cx="76" cy="64" rx="10" ry="6" fill="#F5E090" opacity="0.35" transform="rotate(-25 76 64)"/>
        <text x="100" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#7A5210">₩</text>
        <circle cx="170" cy="36" r="20" fill="#9C7220"/>
        <circle cx="170" cy="36" r="17" fill="#C9A44A"/>
        <ellipse cx="164" cy="30" rx="8" ry="5" fill="#E8C870" opacity="0.45" transform="rotate(-20 164 30)"/>
        <text x="170" y="43" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#7A5210">$</text>
        <circle cx="26" cy="70" r="15" fill="#9C7220"/>
        <circle cx="26" cy="70" r="12" fill="#C9A44A"/>
        <ellipse cx="21" cy="65" rx="6" ry="4" fill="#E8C870" opacity="0.45" transform="rotate(-20 21 65)"/>
        <text x="26" y="75" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#7A5210">$</text>
        <circle cx="178" cy="118" r="10" fill="#C9A44A" opacity="0.6"/>
        <circle cx="22" cy="118" r="8" fill="#C9A44A" opacity="0.45"/>
        <path d="M152 12 L153 7 L154 12 L159 13 L154 14 L153 19 L152 14 L147 13 Z" fill="#D6AE4F"/>
        <path d="M36 112 L37 108 L38 112 L42 113 L38 114 L37 118 L36 114 L32 113 Z" fill="#D6AE4F" opacity="0.7"/>
        <path d="M182 70 L182.5 67 L183 70 L186 70.5 L183 71 L182.5 74 L182 71 L179 70.5 Z" fill="#D6AE4F" opacity="0.6"/>
        <path d="M14 44 L14.4 41.5 L14.8 44 L17 44.4 L14.8 44.8 L14.4 47 L14 44.8 L11.5 44.4 Z" fill="#D6AE4F" opacity="0.5"/>
      </svg>
    </div>
    <p class="sub">운 탓하기 전에 이거 먼저 해보세요.<br>3분 만에 확인하는 내 머니 마인드</p>
    <div class="meta-row">
      <span><span class="dot"></span>24문항</span>
      <span><span class="dot"></span>약 3분</span>
      <span><span class="dot"></span>6개 영역</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">테스트 시작하기</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="quiz">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">1 / 24</div>
    </div>
    <div class="category-tag" id="categoryTag"></div>
    <div class="question-text" id="questionText"></div>
    <div class="choices">
      <button class="choice" id="choiceA" onclick="answer('A')">
        <span class="choice-letter">A</span>
        <span id="choiceAText"></span>
      </button>
      <button class="choice" id="choiceB" onclick="answer('B')">
        <span class="choice-letter">B</span>
        <span id="choiceBText"></span>
      </button>
    </div>
    <button class="back-link" id="backBtn" onclick="goBack()">← 이전 질문</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="result">
    <div class="result-hero">
      <div class="eyebrow">당신의 머니 마인드</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="pct-ring">
        <div class="pct-num" id="resultPct">0%</div>
        <div class="pct-label">부자 마인드</div>
      </div>
    </div>

    <div class="cat-card" id="catCard">
      <div class="cat-section-title">영역별 분석</div>
      <div id="catBreakdown"></div>
    </div>

    <div class="cta-row">
      <button class="btn btn-primary" id="retakeBtn" onclick="location.reload()">다시 테스트하기</button>
      <button class="btn btn-ghost" id="shareBtn" onclick="shareResult()">결과 공유하기</button>
    </div>
    <p class="source-note">이 테스트는 「부자습관 가난한 습관」(톰 콜리·마이클 야드니)의 문제의식에서 영감을 받아 독자적으로 새롭게 구성한 콘텐츠입니다.</p>
  </div>

</div>
<script>
const QUESTIONS_RAW = [
  { cat:"소비와 투자", q:"돈이 생겼을 때 나의 첫 반응은?", rich:"이 돈을 어떻게 불릴 수 있을지 먼저 생각한다", poor:"필요하거나 원했던 것에 쓸 계획을 세운다" },
  { cat:"소비와 투자", q:"한 달 예산을 짤 때 나는?", rich:"저축할 금액을 먼저 정하고, 나머지로 생활비를 맞춘다", poor:"한 달을 살고 남는 게 있으면 저축한다" },
  { cat:"소비와 투자", q:"빚에 대한 나의 생각은?", rich:"목적이 명확하다면 빚도 전략적으로 활용할 수 있다", poor:"빚은 최대한 지지 않는 게 마음도 편하고 안전하다" },
  { cat:"소비와 투자", q:"내 돈의 흐름을 파악하는 편인가?", rich:"수입과 지출을 주기적으로 확인하고 기록한다", poor:"큰 흐름은 파악하고 있고, 세세하게 관리하진 않는다" },

  { cat:"안정과 기회", q:"안정적인 직장에 대한 나의 생각은?", rich:"수입의 흐름이 다양할수록 경제적으로 더 단단해진다고 생각한다", poor:"안정적인 수입원이 하나 있으면 충분하다고 생각한다" },
  { cat:"안정과 기회", q:"낯선 기회나 제안 앞에서 나는?", rich:"우선 어떤 가능성이 있는지 살펴본다", poor:"검증되지 않은 것보다 익숙하고 확실한 방법을 택한다" },
  { cat:"안정과 기회", q:"재정적 목표를 위해 지금 당장 불편함을 감수하는 것에 대해?", rich:"나중의 더 큰 이익을 위해 지금을 조금 희생할 수 있다", poor:"현재의 삶도 충분히 즐겨야 한다고 생각한다" },
  { cat:"안정과 기회", q:"지금 나의 재정 상황이 불편함이 없을 때 나는?", rich:"지금이 좋아도 더 나은 방향을 찾으려 한다", poor:"잘 돌아가고 있을 때는 굳이 바꾸지 않는 편이다" },

  { cat:"목표와 태도", q:"재정적인 목표를 세울 때 나는?", rich:"지금 당장 가능한 것보다 더 큰 그림을 그리고 거꾸로 계획을 세운다", poor:"현재 상황을 기준으로 실현 가능한 목표를 단계적으로 세운다" },
  { cat:"목표와 태도", q:"내 인생의 방향에 대해 나는?", rich:"내 선택과 행동이 결과를 크게 바꿀 수 있다고 믿는다", poor:"노력도 중요하지만 환경과 타이밍이 더 큰 영향을 준다고 본다" },
  { cat:"목표와 태도", q:"문제가 생겼을 때 당신은 가장 먼저?", rich:"어떻게 풀 수 있을지 방법부터 생각한다", poor:"왜 이런 상황이 생겼는지 원인부터 파악한다" },
  { cat:"목표와 태도", q:"재정적으로 기대했던 결과가 나오지 않았을 때 나는?", rich:"뭐가 잘못됐는지 파악하고 방향을 조정한다", poor:"한동안 시도 자체를 멈추고 충분히 쉬어가는 편이다" },

  { cat:"돈에 대한 감정", q:"주변의 부자나 성공한 사람을 볼 때 나는?", rich:"어떻게 그렇게 됐는지 궁금하고 배울 점을 찾게 된다", poor:"그 사람의 상황이 나와 달라서 크게 참고하진 않는다" },
  { cat:"돈에 대한 감정", q:"돈 이야기를 꺼내는 게?", rich:"필요하면 편하게 꺼낼 수 있다", poor:"상황에 따라 조심스럽게 꺼내는 편이다" },
  { cat:"돈에 대한 감정", q:"돈이 많아지면?", rich:"할 수 있는 것들이 확실히 더 많아진다고 본다", poor:"돈보다 마음가짐이 삶의 질을 더 크게 좌우한다고 본다" },
  { cat:"돈에 대한 감정", q:"내가 경제적으로 넉넉해지는 걸 상상할 때?", rich:"구체적으로 어떻게 그렇게 될 수 있을지 그려진다", poor:"막연히 좋겠다는 생각은 들지만 현실적으로 잘 모르겠다" },

  { cat:"배움과 성장", q:"졸업 이후 배움에 대해 나는?", rich:"관심 있는 분야를 꾸준히 배우고 있다", poor:"필요할 때 찾아서 배우면 충분하다고 생각한다" },
  { cat:"배움과 성장", q:"돈을 버는 데 필요한 것은?", rich:"좋은 아이디어와 실행력이 있으면 자본 없이도 시작할 수 있다", poor:"현실적으로 어느 정도 자본이 있어야 의미 있는 투자가 가능하다" },
  { cat:"배움과 성장", q:"학벌·스펙과 경제적 성공의 관계는?", rich:"결국 어떻게 생각하고 행동하느냐가 더 결정적이라고 본다", poor:"좋은 스펙이 기회를 만드는 데 실질적으로 유리하다고 본다" },
  { cat:"배움과 성장", q:"내 실수에 대해 나는?", rich:"실수에서 배운 점을 다음에 써먹으려 한다", poor:"지나간 실수보다 앞으로를 바라보는 게 더 낫다고 생각한다" },

  { cat:"관계와 나눔", q:"나보다 경제적으로 잘 되는 사람이 주변에 생겼을 때 나는?", rich:"뭘 다르게 했는지 궁금하고 이야기를 들어보고 싶다", poor:"각자 상황이 다르기 때문에 크게 비교하지 않으려 한다" },

  { min:38, max:49,  title:"만년 준비생",                sub:"준비는 완벽한데 시작을 못 함" },

  { min:63, max:74,  title:"남몰래 성장러",              sub:"티 안 나게 달라지는 중" },
  { min:75, max:87,  title:"완주 직전의 마라토너",       sub:"멈추지 않으면 무조건 도착함" },
  { min:88, max:100, title:"완성형 부자 마인드 보유자",  sub:"부자 DNA 이미 켜져 있음" }

    low:  "안정을 최우선으로 두는 편이에요. 확실한 장점이지만, 아주 작은 실험 하나씩 해보는 것만으로도 리스크에 대한 감각이 달라질 거예요."
  },
  "목표와 태도": {

    mid:  "목표는 있지만 크기나 기한이 애매한 편이에요. 목표에 숫자와 날짜를 붙여보는 것만으로 실행력이 확 올라가요.",

  },
  "배움과 성장": {
    high: "지금도 계속 배우고, 실수를 자산으로 바꾸는 편이에요. 학벌보다 사고방식이 중요하다는 걸 이미 실천으로 알고 있어요.",

    low:  "돈이나 관계를 혼자 감당하려는 경향이 있어요. 작은 것 하나를 나누거나 터놓는 연습이 뜻밖의 기회로 이어지는 경우가 꽤 많아요."

let shuffledOptions = [];
let current = 0;
let answers = [];

window.addEventListener('DOMContentLoaded', function() {
  const hash = window.location.hash;
  if (hash && hash.startsWith('#result=')) {
    const parts = hash.replace('#result=', '').split(',').map(Number);
    const pct = parts[0];
    if (!isNaN(pct) && pct >= 0 && pct <= 100) {
      document.getElementById('intro').classList.remove('active');
      document.getElementById('result').classList.add('active');
      const tierIndex = RESULT_TIERS.findIndex(t => pct >= t.min && pct <= t.max);
      const tier = RESULT_TIERS[tierIndex];
      document.getElementById('resultTitle').textContent = tier.title;
      document.getElementById('resultSub').textContent = tier.sub;
      document.getElementById('resultPct').textContent = pct + '%';
      const catOrder = ['소비와 투자','안정과 기회','목표와 태도','돈에 대한 감정','배움과 성장','관계와 나눔'];
      const catPctArr = parts.slice(1);
      const breakdown = document.getElementById('catBreakdown');
      breakdown.innerHTML = '';
      catOrder.forEach(function(cat, i) {
        const catPct = catPctArr[i] !== undefined ? catPctArr[i] : 0;
        const d = CAT_DESC[cat];
        const desc = catPct >= 75 ? d.high : catPct >= 40 ? d.mid : d.low;
        const item = document.createElement('div');
        item.className = 'cat-item';
        item.innerHTML =
          '<div class="cat-item-header">' +
            '<span class="cat-item-name">' + cat + '</span>' +
            '<span class="cat-item-pct">' + catPct + '%</span>' +
          '</div>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" data-target="' + catPct + '"></div></div>' +
          '<div class="cat-item-desc">' + desc + '</div>';
        breakdown.appendChild(item);
      });
      setTimeout(function() {
        document.querySelectorAll('.cat-bar-fill').forEach(function(bar) {
          bar.style.width = bar.dataset.target + '%';
        });
      }, 120);
      document.getElementById('shareBtn').style.display = 'none';
      const retakeBtn = document.getElementById('retakeBtn');
      retakeBtn.textContent = '나도 테스트하기';
      retakeBtn.onclick = function() {
        window.location.href = window.location.pathname;
      };
    }
  }
});

function startQuiz() {
  shuffledOptions = QUESTIONS_RAW.map(() => Math.random() > 0.5);
  current = 0;
  answers = [];
  document.getElementById('intro').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS_RAW[current];
  const richIsA = shuffledOptions[current];
  document.getElementById('categoryTag').textContent = q.cat;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('choiceAText').textContent = richIsA ? q.rich : q.poor;
  document.getElementById('choiceBText').textContent = richIsA ? q.poor : q.rich;
  document.getElementById('progressFill').style.width = (current / QUESTIONS_RAW.length * 100) + '%';
  document.getElementById('progressNum').textContent = (current + 1) + ' / ' + QUESTIONS_RAW.length;
  document.getElementById('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';
}

function answer(choice) {
  const richIsA = shuffledOptions[current];
  const isRich = (choice === 'A') === richIsA;
  answers[current] = isRich;
  current++;
  if (current >= QUESTIONS_RAW.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function goBack() {
  if (current === 0) return;
  current--;
  answers.pop();
  renderQuestion();
}

function shareResult() {
  const title = document.getElementById('resultTitle').textContent;
  const sub = document.getElementById('resultSub').textContent;
  const pct = document.getElementById('resultPct').textContent;
  const url = 'https://dajung53-alt.github.io/money-mindset-test/' + window.location.hash;
  const text = '나의 부자 마인드 지수 ' + pct + '\n"' + title + '"\n' + sub + '\n\n나도 테스트해보기 👉 ' + url;
  if (navigator.share) {
    navigator.share({ title: '부자 마인드 자가진단', text: text, url: url });
  } else {
    navigator.clipboard.writeText(text).then(function() {
      alert('결과가 클립보드에 복사됐어요! 카카오톡에 붙여넣기 하세요.');
    }).catch(function() {
      prompt('아래 텍스트를 복사해서 공유하세요:', text);
    });
  }
}

function showResult() {
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('result').classList.add('active');

  const richCount = answers.filter(Boolean).length;
  const pct = Math.round((richCount / QUESTIONS_RAW.length) * 100);

  const tierIndex = RESULT_TIERS.findIndex(t => pct >= t.min && pct <= t.max);
  const tier = RESULT_TIERS[tierIndex];
  document.getElementById('resultTitle').textContent = tier.title;
  document.getElementById('resultSub').textContent = tier.sub;
  document.getElementById('resultPct').textContent = pct + '%';

  const cats = {};
  QUESTIONS_RAW.forEach((q, i) => {
    if (!cats[q.cat]) cats[q.cat] = { total: 0, rich: 0 };
    cats[q.cat].total++;
    if (answers[i]) cats[q.cat].rich++;
  });

  const catOrder = ['소비와 투자','안정과 기회','목표와 태도','돈에 대한 감정','배움과 성장','관계와 나눔'];
  const catPctArr = catOrder.map(function(cat) {
    const c = cats[cat];
    return c ? Math.round((c.rich / c.total) * 100) : 0;
  });
  try { history.replaceState(null, null, '#result=' + pct + ',' + catPctArr.join(',')); } catch(e) {}

  const breakdown = document.getElementById('catBreakdown');
  breakdown.innerHTML = '';
  Object.keys(cats).forEach(cat => {
    const c = cats[cat];
    const catPct = Math.round((c.rich / c.total) * 100);
    const d = CAT_DESC[cat];
    const desc = catPct >= 75 ? d.high : catPct >= 40 ? d.mid : d.low;
    const item = document.createElement('div');
    item.className = 'cat-item';
    item.innerHTML =
      '<div class="cat-item-header">' +
        '<span class="cat-item-name">' + cat + '</span>' +
        '<span class="cat-item-pct">' + catPct + '%</span>' +
      '</div>' +
      '<div class="cat-bar-track"><div class="cat-bar-fill" data-target="' + catPct + '"></div></div>' +
      '<div class="cat-item-desc">' + desc + '</div>';
    breakdown.appendChild(item);
  });

  setTimeout(function() {
    document.querySelectorAll('.cat-bar-fill').forEach(function(bar) {
      bar.style.width = bar.dataset.target + '%';
    });
  }, 120);
}
</script>
